name: media-srv

networks:
  media:
    name: media
    driver: bridge

volumes:
  jellyfin_cache:

# Common health probe knobs (referenced via YAML anchors below).
x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 60s

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    user: ${PUID}:${PGID}
    group_add:
      - ${RENDER_GID}
    devices:
      - /dev/dri:/dev/dri
    environment:
      - TZ=${TZ}
    ports:
      - 8096:8096
    volumes:
      - ${APPDATA}/jellyfin:/config
      - ${MEDIA}/movies:/data/movies:ro
      - ${MEDIA}/tv:/data/tv:ro
      - jellyfin_cache:/cache
    networks:
      - media
    # Jellyfin image ships its own HEALTHCHECK — don't override.
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "4.0"
        reservations:
          memory: 512M

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    volumes:
      - ${APPDATA}/qbittorrent:/config
      - ${MEDIA}/downloads:/data/downloads
    networks:
      - media
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://localhost:8080/api/v2/app/version || exit 1"]
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 256M

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - 9696:9696
    volumes:
      - ${APPDATA}/prowlarr:/config
    networks:
      - media
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://localhost:9696/ping || exit 1"]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    # Bind to loopback only: reachable by the host watchdog probe, not the LAN.
    # Prowlarr reaches it in-network as http://flaresolverr:8191.
    ports:
      - 127.0.0.1:8191:8191
    networks:
      - media
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://localhost:8191/health || exit 1"]
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - 8989:8989
    volumes:
      - ${APPDATA}/sonarr:/config
      - ${MEDIA}:/data
    networks:
      - media
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://localhost:8989/ping || exit 1"]
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - 7878:7878
    volumes:
      - ${APPDATA}/radarr:/config
      - ${MEDIA}:/data
    networks:
      - media
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://localhost:7878/ping || exit 1"]
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - 6767:6767
    volumes:
      - ${APPDATA}/bazarr:/config
      - ${MEDIA}:/data
    networks:
      - media
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://localhost:6767/ || exit 1"]
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.5"
        reservations:
          memory: 128M

  # Seerr — official successor to Overseerr + Jellyseerr (both deprecated 2025).
  # Auto-migrates the Jellyseerr DB on first start. Runs as node user (UID 1000),
  # so ${APPDATA}/seerr must be owned 1000:1000 — see docs/SETUP.md migration steps.
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    restart: unless-stopped
    init: true
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
      - PORT=5055
    ports:
      - 5055:5055
    volumes:
      - ${APPDATA}/seerr:/app/config
    networks:
      - media
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -qO- --timeout=3 http://localhost:5055/api/v1/status >/dev/null || exit 1"]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M

  # Homepage — single dashboard for the whole stack (status + widgets).
  # docker.sock is mounted read-only for the container-status widget; this grants
  # near-root host access, acceptable here since the stack is LAN/WireGuard-only.
  # Harden later with docker-socket-proxy if exposing beyond the home network.
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      # Run with the host `docker` group as PRIMARY gid so the socket
      # (root:docker 660) is readable. The image's gosu drop to PUID strips
      # supplementary groups, so `group_add` doesn't survive — setting PGID
      # directly does. GID via: getent group docker
      - PGID=${DOCKER_GID}
      - TZ=${TZ}
      - HOMEPAGE_ALLOWED_HOSTS=homepage.media.sys-lab.xyz,${SERVER_IP}:3000
    ports:
      - 3000:3000
    volumes:
      - ${APPDATA}/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - media
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -qO- --timeout=3 http://localhost:3000/ >/dev/null || exit 1"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M

  searcharr:
    image: toddrob/searcharr:latest
    container_name: searcharr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - ${APPDATA}/searcharr:/app/data
    networks:
      - media
    # No HTTP interface — relying on docker's "running" state via watchdog.
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 64M

  janitorr:
    image: ghcr.io/schaka/janitorr:jvm-stable
    container_name: janitorr
    restart: unless-stopped
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
      - JVM_ARGS=-Xmx256M
    volumes:
      - ${APPDATA}/janitorr/config:/config
      - ${APPDATA}/janitorr/logs:/logs
      - ${MEDIA}:/data
    networks:
      - media
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "grep -qa JanitorrApplication /proc/*/cmdline || exit 1"]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
